name: Testes NuvemDesk

on:
  push:
    branches:
      - main
      - feature/back4app-chamados
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  testes:
    name: Testes locais
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v6

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Executar testes
        run: npm test